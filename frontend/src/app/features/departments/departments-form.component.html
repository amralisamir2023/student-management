<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div style="padding:20px 24px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:14px">
      <div>
        <div style="font-size:16.5px;font-weight:800;letter-spacing:-.02em">{{ mode === 'edit' ? 'Edit Department' : 'Add Department' }}</div>
        <div class="mono" style="font-size:11.5px;color:var(--text-faint);margin-top:4px">{{ mode === 'edit' ? 'PUT' : 'POST' }} /api/departments</div>
      </div>
      <button (click)="cancelled.emit()" style="width:32px;height:32px;flex:none;border:none;background:var(--surface-alt);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text)" title="Close"><svg lucideX [size]="15"></svg></button>
    </div>

    <div class="form-grid" style="padding:22px 24px;gap:16px">
      <label class="field" style="grid-column:1 / -1">
        <span class="field-label">Department name<span style="color:var(--danger)"> *</span></span>
        <input type="text" [(ngModel)]="model.name" name="name" placeholder="Computer Science" />
        @if (errors['name']) { <span class="field-error">{{ errors['name'] }}</span> }
      </label>
      <label class="field">
        <span class="field-label">Department code<span style="color:var(--danger)"> *</span></span>
        <input type="text" [(ngModel)]="model.code" name="code" placeholder="CS" />
        @if (errors['code']) { <span class="field-error">{{ errors['code'] }}</span> }
      </label>
      <label class="field" style="grid-column:1 / -1">
        <span class="field-label">Description</span>
        <textarea [(ngModel)]="model.description" name="description" rows="3" placeholder="Short summary of the department"></textarea>
      </label>
    </div>

    <div style="padding:17px 24px;border-top:1px solid var(--border-soft);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;background:var(--surface-alt);border-radius:0 0 18px 18px">
      <button class="btn btn-outline" (click)="cancelled.emit()">Cancel</button>
      <button class="btn btn-primary" (click)="submit()">{{ mode === 'edit' ? 'Save changes' : 'Add Department' }}</button>
    </div>
  </div>
</div>
