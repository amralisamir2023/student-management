<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div style="padding:20px 24px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:14px">
      <div>
        <div style="font-size:16.5px;font-weight:800;letter-spacing:-.02em">{{ mode === 'edit' ? 'Edit Course' : 'Add Course' }}</div>
        <div class="mono" style="font-size:11.5px;color:var(--text-faint);margin-top:4px">{{ mode === 'edit' ? 'PUT' : 'POST' }} /api/courses</div>
      </div>
      <button (click)="cancelled.emit()" style="width:32px;height:32px;flex:none;border:none;background:var(--surface-alt);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text)" title="Close"><svg lucideX [size]="15"></svg></button>
    </div>

    <div class="form-grid" style="padding:22px 24px;gap:16px">
      <label class="field">
        <span class="field-label">Course name<span style="color:var(--danger)"> *</span></span>
        <input type="text" [(ngModel)]="model.name" name="name" placeholder="Data Structures" />
        @if (errors['name']) { <span class="field-error">{{ errors['name'] }}</span> }
      </label>
      <label class="field">
        <span class="field-label">Course code<span style="color:var(--danger)"> *</span></span>
        <input type="text" [(ngModel)]="model.code" name="code" placeholder="CS201" />
        @if (errors['code']) { <span class="field-error">{{ errors['code'] }}</span> }
      </label>
      <label class="field">
        <span class="field-label">Credit hours<span style="color:var(--danger)"> *</span></span>
        <input type="number" [(ngModel)]="model.hours" name="hours" min="1" placeholder="3" />
        @if (errors['hours']) { <span class="field-error">{{ errors['hours'] }}</span> }
      </label>
      <label class="field">
        <span class="field-label">Department<span style="color:var(--danger)"> *</span></span>
        <select [(ngModel)]="model.departmentId" name="departmentId">
          <option value="">Select Department</option>
          @for (d of departments; track d._id) {
            <option [value]="d._id">{{ d.name }} ({{ d.code }})</option>
          }
        </select>
        @if (errors['departmentId']) { <span class="field-error">{{ errors['departmentId'] }}</span> }
      </label>
      <label class="field" style="grid-column:1 / -1">
        <span class="field-label">Instructor</span>
        <select [(ngModel)]="model.instructorId" name="instructorId">
          <option value="">Select Instructor</option>
          @for (i of instructors; track i._id) {
            <option [value]="i._id">{{ i.name }}</option>
          }
        </select>
        <span class="field-hint">Optional — can be assigned later</span>
      </label>
    </div>

    <div style="padding:17px 24px;border-top:1px solid var(--border-soft);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;background:var(--surface-alt);border-radius:0 0 18px 18px">
      <button class="btn btn-outline" (click)="cancelled.emit()">Cancel</button>
      <button class="btn btn-primary" (click)="submit()">{{ mode === 'edit' ? 'Save changes' : 'Add Course' }}</button>
    </div>
  </div>
</div>
