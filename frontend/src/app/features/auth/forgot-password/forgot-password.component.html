<div class="simple-auth-page">
  <div class="card simple-auth-card">
    <div class="simple-auth-logo">
      <svg lucideGraduationCap [size]="19" color="#fff"></svg>
    </div>

    <div class="simple-auth-title">Forgot password?</div>
    <div class="simple-auth-subtitle">
      Enter your email address and we'll send you a link to reset your password.
    </div>

    @if (successMessage) {
      <div class="simple-auth-success">
        <svg lucideCheck [size]="16" class="simple-auth-success-icon"></svg>
        <span>{{ successMessage }}</span>
      </div>
    }

    @if (errorMessage) {
      <div class="simple-auth-error">
        <svg lucideAlertCircle [size]="16" class="simple-auth-error-icon"></svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <label class="field simple-auth-field">
      <span class="field-label">Email</span>
      <input type="email" placeholder="name@nti.edu" [(ngModel)]="email" name="email" (keyup.enter)="submit()" />
    </label>

    <button class="btn btn-primary simple-auth-submit" [disabled]="loading" (click)="submit()">
      {{ loading ? 'Sending…' : 'Send reset link' }}
    </button>

    <div class="simple-auth-footer">
      <a routerLink="/login" class="simple-auth-link">← Back to sign in</a>
    </div>
  </div>
</div>
