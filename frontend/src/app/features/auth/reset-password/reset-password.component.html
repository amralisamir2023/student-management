<div class="simple-auth-page">
  <div class="card simple-auth-card">
    <div class="simple-auth-logo">
      <svg lucideGraduationCap [size]="19" color="#fff"></svg>
    </div>

    <div class="simple-auth-title">Reset password</div>
    <div class="simple-auth-subtitle">Enter your new password below.</div>

    @if (successMessage) {
      <div class="simple-auth-success">
        <svg lucideCheck [size]="16" class="simple-auth-success-icon"></svg>
        <span>{{ successMessage }}</span>
      </div>
    }

    @if (errorMessage) {
      <div class="simple-auth-error">
        <svg lucideAlertCircle [size]="16" class="simple-auth-error-icon"></svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <div class="simple-auth-fields">
      <label class="field">
        <span class="field-label">New password</span>
        <input type="password" placeholder="At least 6 characters" [(ngModel)]="password" name="password" (keyup.enter)="submit()" />
      </label>
      <label class="field">
        <span class="field-label">Confirm password</span>
        <input type="password" placeholder="Re-enter new password" [(ngModel)]="confirmPassword" name="confirmPassword" (keyup.enter)="submit()" />
      </label>
    </div>

    <button class="btn btn-primary simple-auth-submit" [disabled]="loading" (click)="submit()">
      {{ loading ? 'Resetting…' : 'Reset password' }}
    </button>

    <div class="simple-auth-footer">
      <a routerLink="/login" class="simple-auth-link">← Back to sign in</a>
    </div>
  </div>
</div>
