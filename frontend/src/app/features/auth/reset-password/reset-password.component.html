<div class="reset-password-container">
  <div class="reset-password-card">

    <h1>Reset Password</h1>

    <p class="subtitle">
      Enter your new password below.
    </p>

    <div
      *ngIf="successMessage"
      class="success-message"
    >
      {{ successMessage }}
    </div>

    <div
      *ngIf="errorMessage"
      class="error-message"
    >
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="resetPassword()">

      <label for="password">
        New Password
      </label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter new password"
        required
      />

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="Confirm new password"
        required
      />

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

    </form>

  </div>
</div>
