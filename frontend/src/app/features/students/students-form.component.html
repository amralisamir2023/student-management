<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div style="padding:20px 24px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:14px">
      <div>
        <div style="font-size:16.5px;font-weight:800;letter-spacing:-.02em">{{ mode === 'edit' ? 'Edit Student' : 'Add Student' }}</div>
        <div class="mono" style="font-size:11.5px;color:var(--text-faint);margin-top:4px">{{ mode === 'edit' ? 'PUT' : 'POST' }} /api/students</div>
      </div>
      <button (click)="cancelled.emit()" style="width:32px;height:32px;flex:none;border:none;background:var(--surface-alt);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text)" title="Close"><svg lucideX [size]="15"></svg></button>
    </div>

    <div class="form-grid" style="padding:22px 24px;gap:16px">
      <label class="field">
        <span class="field-label">Full name<span style="color:var(--danger)"> *</span></span>
        <input type="text" [(ngModel)]="model.name" name="name" placeholder="Mariam Adel" />
        @if (errors['name']) { <span class="field-error">{{ errors['name'] }}</span> }
      </label>
      <label class="field">
        <span class="field-label">Email<span style="color:var(--danger)"> *</span></span>
        <input type="email" [(ngModel)]="model.email" name="email" placeholder="name@nti.edu" />
        @if (errors['email']) { <span class="field-error">{{ errors['email'] }}</span> }
      </label>
      <label class="field">
        <span class="field-label">Phone</span>
        <input type="text" [(ngModel)]="model.phone" name="phone" placeholder="010 0000 0000" />
      </label>
      <label class="field">
        <span class="field-label">Age</span>
        <input type="number" [(ngModel)]="model.age" name="age" min="16" max="60" placeholder="20" />
      </label>
      <label class="field">
        <span class="field-label">Level<span style="color:var(--danger)"> *</span></span>
        <select [(ngModel)]="model.level" name="level">
          <option value="">Select Level</option>
          <option value="1">Level 1</option>
          <option value="2">Level 2</option>
          <option value="3">Level 3</option>
          <option value="4">Level 4</option>
        </select>
        @if (errors['level']) { <span class="field-error">{{ errors['level'] }}</span> }
      </label>
      <label class="field" style="grid-column:1 / -1">
        <span class="field-label">Department<span style="color:var(--danger)"> *</span></span>
        <select [(ngModel)]="model.departmentId" name="departmentId">
          <option value="">Select Department</option>
          @for (d of departments; track d._id) {
            <option [value]="d._id">{{ d.name }} ({{ d.code }})</option>
          }
        </select>
        @if (errors['departmentId']) { <span class="field-error">{{ errors['departmentId'] }}</span> }
      </label>
    </div>

    <div style="padding:17px 24px;border-top:1px solid var(--border-soft);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;background:var(--surface-alt);border-radius:0 0 18px 18px">
      <button class="btn btn-outline" (click)="cancelled.emit()">Cancel</button>
      <button class="btn btn-primary" (click)="submit()">{{ mode === 'edit' ? 'Save changes' : 'Add Student' }}</button>
    </div>
  </div>
</div>
